# this_file: .github/workflows/test.yml
name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-project --python ${{ matrix.python }} --with pytest --with pytest-cov pytest --cov=src/fontlab --cov-fail-under=80
      - run: uvx ruff check src tests examples
      - run: uv build
      - run: uv build --directory packages/fontgate
      - run: uv build --directory packages/fontpr
