# this_file: pyproject.toml
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "fontlab"
dynamic = ["version"]
description = "Install FontLab and automate it from external Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fontlab-remopy>=2.0.12"]

[project.urls]
Repository = "https://github.com/Fontlab/fontlab-pypi"

[project.scripts]
fontlab-cli = "fontlab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/fontlab"]

[tool.hatch.build.targets.sdist]
include = ["src/fontlab", "packages", "tests", "examples", "pyproject.toml", "README.md", "LICENSE", "PLAN.md", "TODO.md", "CHANGELOG.md", "DEPENDENCIES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
